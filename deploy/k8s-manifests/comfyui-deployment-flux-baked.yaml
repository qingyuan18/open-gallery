---
# Deployment using the comfyui-s3-flux image which has Flux models baked in.
# Differences vs comfyui-deployment.yaml:
#   - image: comfyui-s3-flux:latest (not comfyui-s3:latest)
#   - NO hostPath mount of /opt/program/models  (the image already has models inside)
# Pair with the new AMI built by build-flux-image-baked-ami.sh that pre-pulls
# this image into containerd's k8s.io namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: default
  labels:
    app: comfyui
    version: v1
    deployment-type: flux-baked
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
        version: v1
    spec:
      serviceAccountName: comfyui-sa

      nodeSelector:
        workload: gpu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

      containers:
      - name: comfyui
        # Image with Flux models baked at /opt/program/models/<subtype>/.
        # Must be pre-pulled into the AMI for fast cold start; pulling 39 GiB
        # at pod startup defeats the purpose.
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/comfyui-s3-flux:latest
        imagePullPolicy: IfNotPresent

        command:
        - bash
        - -lc
        - |
          mkdir -p /tmp/comfyui-logs
          echo "Starting ComfyUI at $(date)" | tee /tmp/comfyui-logs/comfyui_runtime.log
          python -u main.py --listen 0.0.0.0 --port 8188 2>&1 | tee -a /tmp/comfyui-logs/comfyui_runtime.log

        ports:
        - containerPort: 8188
          name: http
          protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "56Gi"
            cpu: "4"
          requests:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /
            port: 8188
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8188
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

        # No volumeMounts — models are inside the image.

        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: PYTHONUNBUFFERED
          value: "1"

      - name: comfyui-cw-metrics
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/comfyui-queue-metrics:latest
        imagePullPolicy: Always
        env:
        - name: AWS_DEFAULT_REGION
          value: "${AWS_REGION}"
        - name: COMFYUI_QUEUE_URL
          value: "http://127.0.0.1:8188/queue"
        - name: METRIC_NAMESPACE
          value: "ComfyUI"
        - name: METRIC_NAME
          value: "QueuePending"
        - name: METRIC_DIMENSION_NAME
          value: "Deployment"
        - name: METRIC_DIMENSION_VALUE
          value: "comfyui"
        - name: POLL_INTERVAL_SEC
          value: "2"
        - name: PUBLISH_TOTAL
          value: "false"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

      # No volumes — image self-contained.
