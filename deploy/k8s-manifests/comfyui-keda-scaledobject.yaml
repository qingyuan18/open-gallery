apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: comfyui-cw-scaler
  namespace: default
  labels:
    app: comfyui
spec:
  scaleTargetRef:
    name: comfyui
  # Scale to zero when there's no work. KEDA's activation threshold
  # (activationTargetMetricValue) controls when 0 → 1 happens; once metric
  # crosses it, KEDA flips to the regular target-based scaling.
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 120         # KEDA waits this long after metric drops before allowing scale-down
  pollingInterval: 5          # how often KEDA polls CloudWatch
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
        scaleDown:
          stabilizationWindowSeconds: 180
  triggers:
  - type: aws-cloudwatch
    metadata:
      namespace: "ComfyUI"
      metricName: "QueuePending"
      # We publish one metric per Deployment (same dimension across all pods)
      dimensionName: "Deployment"
      dimensionValue: "comfyui"
      targetMetricValue: "1"          # target average pending items per pod
      activationTargetMetricValue: "0.5"
      minMetricValue: "0"
      ignoreNullValues: "true"
      metricStat: "Average"
      metricStatPeriod: "10"           # high-resolution metric (sidecar publishes StorageResolution=1)
      metricCollectionTime: "30"       # must be >= 2x metricStatPeriod for reliable data points
      metricEndTimeOffset: "0"
      awsRegion: "us-east-1"
    authenticationRef:
      name: comfyui-cw-auth

