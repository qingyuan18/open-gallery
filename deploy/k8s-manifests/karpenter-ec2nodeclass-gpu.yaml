# Minimal EC2NodeClass for GPU nodes provisioned by Karpenter
# Usage:
#   export CLUSTER_NAME=<your-eks-cluster-name>
#   export SUBNET_ID_1=subnet-xxxxxxxx SUBNET_ID_2=subnet-yyyyyyyy
#   export SG_ID_1=sg-aaaaaaaa SG_ID_2=sg-bbbbbbbb
#   export AMI_ID=ami-0abcde1234567890f   # DLAMI for HyperPod (AL2023-based recommended)
#   envsubst '${CLUSTER_NAME} ${SUBNET_ID_1} ${SUBNET_ID_2} ${SG_ID_1} ${SG_ID_2} ${AMI_ID}' < deploy/k8s-manifests/karpenter-ec2nodeclass-gpu.yaml | kubectl apply -f -
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  # Use AL2023 family for DLAMI-based HyperPod nodes.
  # amiFamily controls bootstrap/user-data template. Ensure your DLAMI base OS is AL2023.
  amiFamily: AL2023

  # Pin to a specific DLAMI by AMI ID (recommended for HyperPod-style nodes)
  amiSelectorTerms:
  - id: ${AMI_ID}

  # One of role or instanceProfile is required. This assumes you installed Karpenter
  # using the recommended AWS quickstart, which creates this role name.
  role: "KarpenterNodeRole-${CLUSTER_NAME}"

  # Select subnets and security groups by ID (no discovery tags required).
  subnetSelectorTerms:
  - id: ${SUBNET_ID_1}
  - id: ${SUBNET_ID_2}
  securityGroupSelectorTerms:
  - id: ${SG_ID_1}
  - id: ${SG_ID_2}


