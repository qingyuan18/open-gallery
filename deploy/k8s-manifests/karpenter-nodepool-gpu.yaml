# Minimal GPU NodePool that matches ComfyUI's nodeSelector (workload=gpu)
# and works hand-in-hand with KEDA-driven pod scaling.
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      # Ensure new nodes carry the label required by ComfyUI Deployment
      labels:
        workload: "gpu"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      # Taint so only pods that explicitly tolerate it (e.g. comfyui) land here.
      # Prevents stray Deployments (hyperpod-dependencies-*, spark-operator-*)
      # from pinning the node and blocking Karpenter consolidation.
      taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
      requirements:
        # Architecture/OS
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Allow only L40S (48GB) instance types. g7e gets randomly substituted
        # with RTX PRO 6000 Blackwell (sm_120) by AWS spot pool, which the
        # PyTorch in our base image doesn't support — pods CrashLoopBackOff.
        # g6e.4xlarge is guaranteed L40S.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6e.4xlarge"]
        # Allow spot + on-demand. Karpenter will prefer spot (cheaper) and fall
        # back to on-demand if spot capacity is not available.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
  disruption:
    # Only consolidate empty nodes to avoid disrupting in-use GPU nodes
    consolidationPolicy: WhenEmpty
    # Reclaim empty nodes 1 min after they go idle. Pods get up to terminationGracePeriod
    # to drain; setting this much shorter risks killing in-flight Flux jobs.
    consolidateAfter: 1m
    # Allow up to 50% of GPU nodes to be disrupted concurrently so a 4→1 scale-down
    # doesn't take 4× the per-node consolidation interval.
    budgets:
    - nodes: "50%"

